<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071116">
  <title>Вхід — PlayFinder</title>
</head>
<body data-page="login">
  <header class="header"><div class="container header__container"><a class="logo" href="./index.html"><span class="logo__name">Play<span class="logo__name-text">Finder</span></span></a><nav class="nav" aria-label="Основна навігація"><a class="nav__link" href="./games.html">Ігри</a><a class="nav__link" href="./prices.html">Порівняння цін</a></nav></div></header>
  <main class="container placeholder-page">
    <h1 class="placeholder-page__title">Вхід</h1>
    <p id="authStatus" role="status">Вхід через Firebase</p>
    <form id="authForm" class="auth-form"><fieldset class="auth-form__fields">
      <legend>Вхід або створення акаунта</legend>
      <label>Email <input name="email" type="email" autocomplete="email" required></label>
      <label>Пароль <input name="password" type="password" autocomplete="current-password" minlength="6" required></label>
      <button type="submit" value="login">Увійти</button>
      <button type="submit" value="register">Зареєструватися</button>
    </fieldset></form>
    <button id="logoutButton" type="button" hidden>Вийти</button>
    <a href="./favorites.html">Перейти в обране</a>
    <a class="placeholder-page__link" href="./index.html">На головну →</a>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
